<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none" role="img" aria-label="Italiano A1 - Empezá hoy">
  <defs>
    <linearGradient id="bgIp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e8f5e9"/>
    </linearGradient>
    <linearGradient id="brandIp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ec1389"/><stop offset="1" stop-color="#00b6ed"/>
    </linearGradient>
    <linearGradient id="greenIp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#009246"/><stop offset="1" stop-color="#006d33"/>
    </linearGradient>
    <radialGradient id="gIp" cx=".5" cy=".45" r=".65">
      <stop offset="0" stop-color="#009246" stop-opacity=".2"/>
      <stop offset="1" stop-color="#009246" stop-opacity="0"/>
    </radialGradient>
    <filter id="shIp" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="5"/>
      <feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="600" rx="40" fill="url(#bgIp)"/>
  <circle cx="300" cy="300" r="300" fill="url(#gIp)"/>

  <g opacity=".15">
    <circle cx="90" cy="100" r="55" fill="#009246"/>
    <circle cx="530" cy="500" r="70" fill="#ce2b37"/>
    <circle cx="510" cy="80" r="14" fill="#ec1389"/>
  </g>

  <!-- Badge -->
  <g filter="url(#shIp)">
    <rect x="195" y="60" width="210" height="46" rx="23" fill="url(#brandIp)"/>
    <text x="300" y="89" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#fff" letter-spacing="1.3">✦ EMPEZA HOY</text>
  </g>

  <!-- Pasaporte italiano stylized -->
  <g transform="translate(300 330)" filter="url(#shIp)">
    <!-- Pasaporte cover -->
    <rect x="-110" y="-140" width="220" height="280" rx="14" fill="url(#greenIp)"/>
    <rect x="-110" y="-140" width="220" height="280" rx="14" fill="#000" opacity=".0"/>
    <!-- Texto superior -->
    <text x="0" y="-100" text-anchor="middle" font-family="'Sora', system-ui, sans-serif" font-size="14" font-weight="900" fill="#ffd24d" letter-spacing="1.5">REPUBBLICA ITALIANA</text>
    <!-- Escudo stylized -->
    <g transform="translate(0 -40)">
      <circle r="38" fill="#ffd24d"/>
      <circle r="32" fill="none" stroke="#009246" stroke-width="3"/>
      <!-- Estrella italiana -->
      <path d="M 0 -22 L 6 -7 L 22 -7 L 9 3 L 14 18 L 0 9 L -14 18 L -9 3 L -22 -7 L -6 -7 Z" fill="#009246"/>
    </g>
    <text x="0" y="22" text-anchor="middle" font-family="'Sora', system-ui, sans-serif" font-size="18" font-weight="900" fill="#ffd24d">PASSAPORTO</text>
    <!-- Linea decorativa -->
    <line x1="-80" y1="40" x2="80" y2="40" stroke="#ffd24d" stroke-width="2"/>
    <!-- Nombre y nivel mock -->
    <text x="0" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" opacity=".8">NOME / NAME</text>
    <text x="0" y="80" text-anchor="middle" font-family="'Sora', system-ui, sans-serif" font-size="15" font-weight="900" fill="#ffffff">Studente A1</text>
    <text x="0" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" opacity=".8">LIVELLO</text>
    <text x="0" y="126" text-anchor="middle" font-family="'Sora', system-ui, sans-serif" font-size="15" font-weight="900" fill="#ffd24d">A1 INIZIALE</text>
  </g>

  <!-- Sello "CERTIFICATO" -->
  <g transform="translate(490 195)" filter="url(#shIp)">
    <circle cx="0" cy="0" r="52" fill="#ffffff" stroke="#ce2b37" stroke-width="4" stroke-dasharray="3 2"/>
    <text x="0" y="-10" text-anchor="middle" font-family="'Sora', system-ui, sans-serif" font-size="10" font-weight="900" fill="#ce2b37" letter-spacing="1.5">CERTIFICATO</text>
    <text x="0" y="12" text-anchor="middle" font-family="'Sora', system-ui, sans-serif" font-size="20" font-weight="900" fill="#0a0a0f">A1</text>
    <text x="0" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#5a5d72">oficial</text>
  </g>

  <!-- Bubbles -->
  <g filter="url(#shIp)">
    <g transform="translate(55 240)"><rect x="0" y="0" width="100" height="42" rx="21" fill="#fff"/><path d="M20 42 L14 52 L28 42 Z" fill="#fff"/><text x="50" y="26" text-anchor="middle" font-family="'Sora', system-ui, sans-serif" font-size="15" font-weight="900" fill="url(#brandIp)">Ciao!</text></g>
    <g transform="translate(55 430)"><rect x="0" y="0" width="120" height="42" rx="21" fill="#fff"/><text x="60" y="26" text-anchor="middle" font-family="'Sora', system-ui, sans-serif" font-size="14" font-weight="900" fill="#0a0a0f">Andiamo!</text></g>
  </g>

  <text x="300" y="545" text-anchor="middle" font-family="'Sora', system-ui, sans-serif" font-size="22" font-weight="900" fill="#0a0a0f" letter-spacing="-0.3">Empezá tu italiano hoy</text>
  <text x="300" y="572" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#5a5d72">Desde cero · Certificado · 30 días de acceso</text>
</svg>
