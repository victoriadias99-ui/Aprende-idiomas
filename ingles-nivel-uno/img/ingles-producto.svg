<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none" role="img" aria-label="Inglés Nivel 1 - Sumá inglés a tu CV">
  <defs>
    <!-- Fondo suave celeste-rosa muy sutil -->
    <linearGradient id="bgSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e3f6fd"/>
    </linearGradient>
    <!-- Gradiente brand (magenta -> celeste) -->
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ec1389"/>
      <stop offset="1" stop-color="#00b6ed"/>
    </linearGradient>
    <linearGradient id="cyanG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00b6ed"/>
      <stop offset="1" stop-color="#0085b0"/>
    </linearGradient>
    <linearGradient id="pinkG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ec1389"/>
      <stop offset="1" stop-color="#b30e68"/>
    </linearGradient>
    <!-- Papel/card -->
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f9fc"/>
    </linearGradient>
    <!-- Glow -->
    <radialGradient id="glow" cx=".5" cy=".5" r=".6">
      <stop offset="0" stop-color="#00b6ed" stop-opacity=".22"/>
      <stop offset="1" stop-color="#00b6ed" stop-opacity="0"/>
    </radialGradient>
    <!-- Shadow filter -->
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="600" height="600" rx="40" fill="url(#bgSoft)"/>
  <circle cx="300" cy="300" r="280" fill="url(#glow)"/>

  <!-- Shapes decorativas organicas -->
  <g opacity=".15">
    <circle cx="80" cy="90" r="50" fill="#ec1389"/>
    <circle cx="540" cy="510" r="70" fill="#00b6ed"/>
    <circle cx="510" cy="80" r="14" fill="#ec1389"/>
    <circle cx="85" cy="520" r="20" fill="#00b6ed"/>
  </g>

  <!-- Puntos decorativos -->
  <g fill="#00b6ed" opacity=".55">
    <circle cx="125" cy="180" r="3"/>
    <circle cx="140" cy="170" r="2"/>
    <circle cx="135" cy="195" r="2"/>
    <circle cx="470" cy="420" r="3"/>
    <circle cx="485" cy="410" r="2"/>
    <circle cx="480" cy="435" r="2"/>
  </g>

  <!-- Badge top: "A1 · Principiantes" -->
  <g filter="url(#soft)">
    <rect x="180" y="60" width="240" height="46" rx="23" fill="url(#brand)"/>
    <text x="300" y="89" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="17" font-weight="800" fill="#ffffff" letter-spacing="1.2">
      INGLES NIVEL 1 · A1
    </text>
  </g>

  <!-- LAPTOP central (flat illustration) -->
  <g filter="url(#soft)">
    <!-- Screen -->
    <rect x="140" y="195" width="320" height="210" rx="16" fill="#0a0a0f"/>
    <rect x="152" y="207" width="296" height="186" rx="8" fill="url(#card)"/>
    <!-- Browser chrome -->
    <rect x="152" y="207" width="296" height="24" rx="8" fill="#eef2f7"/>
    <circle cx="165" cy="219" r="3.5" fill="#ff5f57"/>
    <circle cx="178" cy="219" r="3.5" fill="#febb2e"/>
    <circle cx="191" cy="219" r="3.5" fill="#27c93f"/>
    <rect x="210" y="213" width="200" height="12" rx="6" fill="#fff"/>

    <!-- Contenido pantalla: logo inglés + lesson -->
    <g transform="translate(170 245)">
      <!-- Union Jack circular mini -->
      <circle cx="20" cy="20" r="18" fill="#012169"/>
      <g clip-path="inset(0 round 18px)">
        <circle cx="20" cy="20" r="18" fill="#012169"/>
        <rect x="2" y="16" width="36" height="8" fill="#fff"/>
        <rect x="16" y="2" width="8" height="36" fill="#fff"/>
        <rect x="2" y="18" width="36" height="4" fill="#cf142b"/>
        <rect x="18" y="2" width="4" height="36" fill="#cf142b"/>
      </g>
      <!-- Titulo y barras de texto simulando lesson -->
      <text x="50" y="18" font-family="'Sora', system-ui, sans-serif" font-size="15" font-weight="800" fill="#0a0a0f">Lesson 1</text>
      <text x="50" y="34" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#5a5d72">Greetings &amp; intro</text>
      <!-- Progress bar -->
      <rect x="0" y="60" width="260" height="10" rx="5" fill="#eef2f7"/>
      <rect x="0" y="60" width="170" height="10" rx="5" fill="url(#brand)"/>
      <!-- Lines simulando contenido -->
      <rect x="0" y="86" width="260" height="8" rx="4" fill="#e3e8ef"/>
      <rect x="0" y="100" width="220" height="8" rx="4" fill="#e3e8ef"/>
      <rect x="0" y="114" width="180" height="8" rx="4" fill="#e3e8ef"/>
    </g>
    <!-- Base del laptop -->
    <path d="M120 405 L480 405 L490 425 Q490 430 485 430 L115 430 Q110 430 110 425 Z" fill="#1f2030"/>
    <rect x="280" y="405" width="40" height="6" rx="3" fill="#0a0a0f"/>
  </g>

  <!-- Chat bubbles con palabras en ingles -->
  <g filter="url(#soft)">
    <!-- Bubble 1: Hello! -->
    <g transform="translate(75 240)">
      <rect x="0" y="0" width="110" height="44" rx="22" fill="#ffffff"/>
      <path d="M20 44 L14 54 L28 44 Z" fill="#ffffff"/>
      <text x="55" y="28" text-anchor="middle" font-family="'Sora', system-ui, sans-serif" font-size="16" font-weight="800" fill="url(#pinkG)">Hello!</text>
    </g>
    <!-- Bubble 2: Future -->
    <g transform="translate(440 150)">
      <rect x="0" y="0" width="110" height="44" rx="22" fill="#ffffff"/>
      <path d="M80 44 L96 54 L72 44 Z" fill="#ffffff"/>
      <text x="55" y="28" text-anchor="middle" font-family="'Sora', system-ui, sans-serif" font-size="15" font-weight="800" fill="url(#cyanG)">Future</text>
    </g>
    <!-- Bubble 3: Grammar -->
    <g transform="translate(55 420)">
      <rect x="0" y="0" width="130" height="44" rx="22" fill="#ffffff"/>
      <text x="65" y="28" text-anchor="middle" font-family="'Sora', system-ui, sans-serif" font-size="15" font-weight="800" fill="#0a0a0f">Grammar</text>
    </g>
    <!-- Bubble 4: World -->
    <g transform="translate(440 440)">
      <rect x="0" y="0" width="110" height="44" rx="22" fill="#ffffff"/>
      <text x="55" y="28" text-anchor="middle" font-family="'Sora', system-ui, sans-serif" font-size="15" font-weight="800" fill="url(#pinkG)">World</text>
    </g>
  </g>

  <!-- Estrella brillante top right -->
  <g transform="translate(495 170)" opacity=".9">
    <path d="M0 -18 L4 -4 L18 0 L4 4 L0 18 L-4 4 L-18 0 L-4 -4 Z" fill="url(#brand)"/>
  </g>
  <g transform="translate(145 130)" opacity=".7">
    <path d="M0 -10 L2.5 -2.5 L10 0 L2.5 2.5 L0 10 L-2.5 2.5 L-10 0 L-2.5 -2.5 Z" fill="#ec1389"/>
  </g>

  <!-- Tagline inferior -->
  <g>
    <text x="300" y="495" text-anchor="middle" font-family="'Sora', system-ui, sans-serif"
          font-size="30" font-weight="900" fill="#0a0a0f" letter-spacing="-0.5">
      Aprendé inglés online
    </text>
    <text x="300" y="525" text-anchor="middle" font-family="system-ui, sans-serif"
          font-size="15" font-weight="600" fill="#5a5d72">
      Desde cero · a tu ritmo · certificado oficial
    </text>
  </g>

  <!-- Checkmarks + etiquetas abajo -->
  <g transform="translate(120 548)" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1f2030">
    <g>
      <circle cx="8" cy="0" r="8" fill="url(#cyanG)"/>
      <path d="M4 0 L7 3 L12 -3" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="22" y="4">+25 clases</text>
    </g>
    <g transform="translate(130 0)">
      <circle cx="8" cy="0" r="8" fill="url(#cyanG)"/>
      <path d="M4 0 L7 3 L12 -3" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="22" y="4">Certificado</text>
    </g>
    <g transform="translate(265 0)">
      <circle cx="8" cy="0" r="8" fill="url(#cyanG)"/>
      <path d="M4 0 L7 3 L12 -3" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="22" y="4">Soporte 24/7</text>
    </g>
  </g>
</svg>
