<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none" role="img" aria-label="Aprenderás italiano A2 - Plan de estudio">
  <defs>
    <linearGradient id="bgA2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#fce7f3"/>
    </linearGradient>
    <linearGradient id="brandA2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ec1389"/><stop offset="1" stop-color="#00b6ed"/>
    </linearGradient>
    <linearGradient id="bookA2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#009246"/><stop offset="1" stop-color="#006d33"/>
    </linearGradient>
    <radialGradient id="gA2" cx=".5" cy=".5" r=".6">
      <stop offset="0" stop-color="#ec1389" stop-opacity=".15"/>
      <stop offset="1" stop-color="#ec1389" stop-opacity="0"/>
    </radialGradient>
    <filter id="sA2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="5"/>
      <feComponentTransfer><feFuncA type="linear" slope=".2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="600" rx="40" fill="url(#bgA2)"/>
  <circle cx="300" cy="300" r="280" fill="url(#gA2)"/>

  <g opacity=".15">
    <circle cx="80" cy="90" r="50" fill="#ec1389"/>
    <circle cx="540" cy="510" r="70" fill="#00b6ed"/>
  </g>

  <g filter="url(#sA2)">
    <rect x="190" y="55" width="220" height="46" rx="23" fill="url(#brandA2)"/>
    <text x="300" y="84" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#fff" letter-spacing="1.3">🇮🇹 ITALIANO A2 · INTERMEDIO</text>
  </g>

  <!-- Libro abierto -->
  <g transform="translate(300 300)" filter="url(#sA2)">
    <ellipse cx="0" cy="110" rx="180" ry="12" fill="#0a0a0f" opacity=".12"/>
    <path d="M -165 -95 L -10 -110 L -10 95 L -165 110 Z" fill="url(#bookA2)"/>
    <path d="M 165 -95 L 10 -110 L 10 95 L 165 110 Z" fill="url(#bookA2)"/>
    <path d="M -160 -88 L -15 -103 L -15 88 L -160 103 Z" fill="#fffdf5"/>
    <path d="M 160 -88 L 15 -103 L 15 88 L 160 103 Z" fill="#fffdf5"/>
    <rect x="-12" y="-105" width="24" height="210" fill="#054b22"/>

    <g stroke="#9ca3af" stroke-width="3" stroke-linecap="round" opacity=".7">
      <line x1="-145" y1="-60" x2="-30" y2="-70"/>
      <line x1="-145" y1="-40" x2="-55" y2="-50"/>
      <line x1="-145" y1="-20" x2="-40" y2="-30"/>
    </g>
    <rect x="-145" y="5" width="130" height="28" rx="5" fill="#fce7f3"/>
    <text x="-80" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#be185d">Passato prossimo</text>

    <g stroke="#9ca3af" stroke-width="3" stroke-linecap="round" opacity=".7">
      <line x1="30" y1="-70" x2="145" y2="-60"/>
      <line x1="55" y1="-50" x2="145" y2="-40"/>
      <line x1="40" y1="-30" x2="145" y2="-20"/>
    </g>
    <rect x="15" y="5" width="130" height="28" rx="5" fill="#dbeafe"/>
    <text x="80" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1d4ed8">Imperfetto</text>
  </g>

  <g filter="url(#sA2)">
    <g transform="translate(55 175)"><rect x="0" y="0" width="130" height="42" rx="21" fill="#fff"/><text x="65" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ec1389">Conversazione</text></g>
    <g transform="translate(420 160)"><rect x="0" y="0" width="140" height="42" rx="21" fill="#fff"/><text x="70" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#009246">Preposizioni</text></g>
    <g transform="translate(55 435)"><rect x="0" y="0" width="130" height="42" rx="21" fill="#fff"/><text x="65" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#0a0a0f">Comparativi</text></g>
    <g transform="translate(420 440)"><rect x="0" y="0" width="140" height="42" rx="21" fill="#fff"/><text x="70" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ce2b37">Futuro</text></g>
  </g>

  <text x="300" y="548" text-anchor="middle" font-family="'Sora', system-ui, sans-serif" font-size="22" font-weight="900" fill="#0a0a0f" letter-spacing="-0.3">Continuá desde A1 · Nivel A2</text>
</svg>
