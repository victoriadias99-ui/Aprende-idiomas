<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="bgEn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#012169"/>
      <stop offset="1" stop-color="#0074d4"/>
    </linearGradient>
    <linearGradient id="bookG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6c07a"/>
      <stop offset="1" stop-color="#b58840"/>
    </linearGradient>
    <linearGradient id="pageG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset="1" stop-color="#f0ebda"/>
    </linearGradient>
    <radialGradient id="glowEn" cx=".5" cy=".5" r=".6">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" rx="40" fill="url(#bgEn)"/>
  <circle cx="300" cy="300" r="280" fill="url(#glowEn)"/>

  <!-- UK flag stylized (Union Jack pattern in background) -->
  <g opacity=".35" transform="translate(300 300)">
    <!-- white cross -->
    <rect x="-260" y="-55" width="520" height="110" fill="#fff"/>
    <rect x="-55" y="-260" width="110" height="520" fill="#fff"/>
    <!-- red cross -->
    <rect x="-260" y="-25" width="520" height="50" fill="#cf142b"/>
    <rect x="-25" y="-260" width="50" height="520" fill="#cf142b"/>
    <!-- diagonals (white) -->
    <g>
      <rect x="-320" y="-38" width="640" height="76" fill="#fff" transform="rotate(32)"/>
      <rect x="-320" y="-38" width="640" height="76" fill="#fff" transform="rotate(-32)"/>
    </g>
    <!-- red diagonals -->
    <g>
      <rect x="-320" y="-16" width="640" height="32" fill="#cf142b" transform="rotate(32)"/>
      <rect x="-320" y="-16" width="640" height="32" fill="#cf142b" transform="rotate(-32)"/>
    </g>
  </g>

  <!-- stars/sparkles -->
  <g fill="#fff" opacity=".8">
    <circle cx="90" cy="100" r="4"/>
    <circle cx="520" cy="140" r="5"/>
    <circle cx="110" cy="510" r="4"/>
    <circle cx="500" cy="490" r="3"/>
  </g>

  <!-- Book in center -->
  <g transform="translate(300 320)">
    <!-- shadow -->
    <ellipse cx="0" cy="140" rx="160" ry="16" fill="#000" opacity=".3"/>
    <!-- spine/binding behind -->
    <path d="M -145 -110 L 145 -110 L 150 135 L -150 135 Z" fill="#8c5e20" stroke="#0a0a0f" stroke-width="5" stroke-linejoin="round"/>
    <!-- pages layered effect -->
    <path d="M -135 -100 L 135 -100 L 138 126 L -138 126 Z" fill="url(#pageG)" stroke="#0a0a0f" stroke-width="4" stroke-linejoin="round"/>
    <!-- cover front tilted -->
    <path d="M -130 -95 L 130 -95 L 132 122 L -132 122 Z" fill="url(#bookG)" stroke="#0a0a0f" stroke-width="5" stroke-linejoin="round"/>
    <!-- page lines on cover -->
    <g font-family="Impact, Arial Black, sans-serif" font-weight="900" fill="#0a0a0f" text-anchor="middle">
      <text x="0" y="-20" font-size="34">DO YOU</text>
      <text x="0" y="22" font-size="34">SPEAK</text>
      <text x="0" y="78" font-size="44" letter-spacing="2">ENGLISH?</text>
    </g>
    <!-- bookmark ribbon -->
    <path d="M 80 -95 L 80 -35 L 90 -50 L 100 -35 L 100 -95 Z" fill="#cf142b" stroke="#0a0a0f" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- Corner circular badge with A1 (level) -->
  <g transform="translate(100 140)">
    <circle r="50" fill="#fff" stroke="#0a0a0f" stroke-width="5"/>
    <text y="-4" text-anchor="middle" font-family="system-ui, Arial" font-size="11" font-weight="800" fill="#0074d4" letter-spacing="1.5">NIVEL</text>
    <text y="22" text-anchor="middle" font-family="system-ui, Arial Black" font-size="32" font-weight="900" fill="#012169">A1</text>
  </g>
</svg>
