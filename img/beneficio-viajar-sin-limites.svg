<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="bgVL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffce3c"/>
      <stop offset="1" stop-color="#ff8a00"/>
    </linearGradient>
    <radialGradient id="globeG" cx=".3" cy=".3" r=".8">
      <stop offset="0" stop-color="#5cc8ff"/>
      <stop offset="1" stop-color="#0074d4"/>
    </radialGradient>
    <radialGradient id="glowVL" cx=".5" cy=".5" r=".6">
      <stop offset="0" stop-color="#fff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" rx="40" fill="url(#bgVL)"/>
  <circle cx="300" cy="300" r="280" fill="url(#glowVL)"/>
  <!-- dotted flight path arc -->
  <g stroke="#fff" stroke-width="3" fill="none" opacity=".8" stroke-dasharray="6 10" stroke-linecap="round">
    <path d="M 90 430 Q 300 200 520 340"/>
    <path d="M 100 200 Q 300 80 500 200" opacity=".6"/>
  </g>
  <!-- clouds -->
  <g fill="#fff" opacity=".7">
    <ellipse cx="110" cy="150" rx="38" ry="12"/>
    <ellipse cx="480" cy="120" rx="48" ry="14"/>
    <ellipse cx="490" cy="470" rx="42" ry="12"/>
  </g>
  <!-- globe -->
  <g transform="translate(300 310)">
    <circle r="160" fill="url(#globeG)" stroke="#0a0a0f" stroke-width="6"/>
    <!-- latitude lines -->
    <g stroke="#fff" stroke-width="2" fill="none" opacity=".55">
      <ellipse rx="160" ry="60"/>
      <ellipse rx="160" ry="120"/>
      <path d="M-160 0 L160 0"/>
      <path d="M0 -160 L0 160"/>
    </g>
    <!-- continents (stylized) -->
    <g fill="#4fd18a">
      <path d="M-100 -40 Q-60 -60 -30 -30 Q-10 -10 -40 10 Q-80 20 -100 -10 Z"/>
      <path d="M20 -60 Q70 -70 100 -40 Q110 -10 80 0 Q40 -10 20 -30 Z"/>
      <path d="M-80 40 Q-40 30 -20 70 Q-40 100 -70 90 Q-100 70 -80 40 Z"/>
      <path d="M30 40 Q80 40 110 70 Q90 110 50 100 Q20 80 30 40 Z"/>
    </g>
    <!-- paper plane -->
    <g transform="translate(95 -95) rotate(25)">
      <path d="M0 0 L60 -16 L42 22 L28 14 L10 30 L20 14 Z" fill="#fff" stroke="#0a0a0f" stroke-width="4" stroke-linejoin="round"/>
      <path d="M28 14 L42 22" stroke="#0a0a0f" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
  <!-- pin marker -->
  <g transform="translate(480 410)">
    <path d="M0 -30 C-16 -30 -24 -18 -24 -6 C-24 10 0 30 0 30 C0 30 24 10 24 -6 C24 -18 16 -30 0 -30 Z" fill="#ec1389" stroke="#0a0a0f" stroke-width="4"/>
    <circle cy="-8" r="7" fill="#fff"/>
  </g>
</svg>
