<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="bgJp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb7c5"/>
      <stop offset=".5" stop-color="#f5a4b8"/>
      <stop offset="1" stop-color="#bd0029"/>
    </linearGradient>
    <radialGradient id="sunJ" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe3e3"/>
      <stop offset="1" stop-color="#bc002d"/>
    </radialGradient>
    <radialGradient id="glowJp" cx=".5" cy=".5" r=".6">
      <stop offset="0" stop-color="#fff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" rx="40" fill="url(#bgJp)"/>
  <circle cx="300" cy="280" r="280" fill="url(#glowJp)"/>

  <!-- Sun (Japan flag motif) -->
  <circle cx="300" cy="270" r="150" fill="url(#sunJ)" stroke="#0a0a0f" stroke-width="6"/>
  <circle cx="300" cy="270" r="150" fill="url(#glowJp)" opacity=".6"/>

  <!-- Sakura petals -->
  <g fill="#fff">
    <g transform="translate(110 120)">
      <g opacity=".95">
        <path d="M 0 -15 C 6 -12 10 -5 6 2 C 12 2 16 8 12 14 C 8 20 2 18 -2 14 C -8 18 -14 14 -14 6 C -18 0 -12 -8 -4 -8 C -6 -14 0 -18 0 -15 Z" fill="#ffd9e0" stroke="#ec1389" stroke-width="2"/>
        <circle r="3" fill="#ec1389"/>
      </g>
    </g>
    <g transform="translate(490 140) rotate(30)">
      <path d="M 0 -15 C 6 -12 10 -5 6 2 C 12 2 16 8 12 14 C 8 20 2 18 -2 14 C -8 18 -14 14 -14 6 C -18 0 -12 -8 -4 -8 C -6 -14 0 -18 0 -15 Z" fill="#ffd9e0" stroke="#ec1389" stroke-width="2"/>
      <circle r="3" fill="#ec1389"/>
    </g>
    <g transform="translate(130 490) rotate(-20)">
      <path d="M 0 -12 C 5 -10 8 -4 5 2 C 10 2 13 6 10 12 C 6 16 2 14 -2 12 C -6 14 -12 12 -12 4 C -14 0 -10 -6 -3 -6 C -5 -12 0 -14 0 -12 Z" fill="#ffd9e0" stroke="#ec1389" stroke-width="2"/>
      <circle r="2.5" fill="#ec1389"/>
    </g>
    <g transform="translate(500 490) rotate(45)">
      <path d="M 0 -15 C 6 -12 10 -5 6 2 C 12 2 16 8 12 14 C 8 20 2 18 -2 14 C -8 18 -14 14 -14 6 C -18 0 -12 -8 -4 -8 C -6 -14 0 -18 0 -15 Z" fill="#ffd9e0" stroke="#ec1389" stroke-width="2"/>
      <circle r="3" fill="#ec1389"/>
    </g>
  </g>

  <!-- Japanese kanji in center: 日本 -->
  <g transform="translate(300 270)" fill="#fff" stroke="#0a0a0f" stroke-width="2" font-family="serif" font-size="90" font-weight="900" text-anchor="middle">
    <text y="35">日本</text>
  </g>

  <!-- Torii gate at bottom -->
  <g transform="translate(300 470)" stroke="#0a0a0f" stroke-width="5" stroke-linejoin="round" fill="#e60039">
    <!-- pillars -->
    <rect x="-90" y="-50" width="14" height="80"/>
    <rect x="76" y="-50" width="14" height="80"/>
    <!-- lower horizontal -->
    <rect x="-95" y="-30" width="190" height="10"/>
    <!-- top beam curved -->
    <path d="M -110 -60 Q 0 -78 110 -60 L 105 -50 Q 0 -66 -105 -50 Z"/>
    <!-- top roof -->
    <rect x="-115" y="-70" width="230" height="10"/>
  </g>

  <!-- Speech bubble "こんにちは" -->
  <g transform="translate(85 270)">
    <path d="M0 0 H150 Q170 0 170 20 V50 Q170 70 150 70 H40 L20 88 L24 70 Q0 68 0 50 Z" fill="#fff" stroke="#0a0a0f" stroke-width="5"/>
    <text x="85" y="46" text-anchor="middle" font-family="system-ui, Arial Black, sans-serif" font-size="22" font-weight="900" fill="#bd0029">こんにちは!</text>
  </g>
</svg>
