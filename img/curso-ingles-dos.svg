<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="bgE2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0074d4"/>
      <stop offset="1" stop-color="#002244"/>
    </linearGradient>
    <linearGradient id="book2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ad4ff"/>
      <stop offset="1" stop-color="#0074d4"/>
    </linearGradient>
    <radialGradient id="glowE2" cx=".5" cy=".5" r=".6">
      <stop offset="0" stop-color="#fff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" rx="40" fill="url(#bgE2)"/>
  <circle cx="300" cy="300" r="280" fill="url(#glowE2)"/>

  <!-- UK flag subtle pattern -->
  <g opacity=".28" transform="translate(300 300)">
    <rect x="-280" y="-50" width="560" height="100" fill="#fff"/>
    <rect x="-50" y="-280" width="100" height="560" fill="#fff"/>
    <rect x="-280" y="-25" width="560" height="50" fill="#cf142b"/>
    <rect x="-25" y="-280" width="50" height="560" fill="#cf142b"/>
  </g>

  <g fill="#fff" opacity=".85">
    <path d="M 85 100 l 4 9 9 1 -7 7 2 10 -8 -5 -8 5 2 -10 -7 -7 9 -1 z"/>
    <circle cx="520" cy="140" r="5"/>
    <circle cx="100" cy="500" r="4"/>
    <circle cx="510" cy="480" r="3"/>
  </g>

  <!-- Stack of 2 books representing nivel 2 -->
  <g transform="translate(300 330)">
    <ellipse cx="0" cy="140" rx="170" ry="16" fill="#000" opacity=".3"/>

    <!-- Book 1 (bottom, laying flat) -->
    <g transform="translate(0 80)">
      <rect x="-150" y="-20" width="300" height="40" rx="4" fill="#b58840" stroke="#0a0a0f" stroke-width="5"/>
      <rect x="-150" y="-14" width="300" height="4" fill="#8c5e20" opacity=".5"/>
      <text x="0" y="8" text-anchor="middle" font-family="system-ui, Arial Black" font-size="16" font-weight="900" fill="#0a0a0f" letter-spacing="2">NIVEL 1</text>
    </g>

    <!-- Book 2 (on top, opening/standing) -->
    <g transform="translate(0 -20)">
      <path d="M -130 -100 L 130 -100 L 135 90 L -135 90 Z" fill="#8c5e20" stroke="#0a0a0f" stroke-width="5" stroke-linejoin="round"/>
      <path d="M -125 -95 L 125 -95 L 128 85 L -128 85 Z" fill="url(#book2)" stroke="#0a0a0f" stroke-width="5" stroke-linejoin="round"/>
      <!-- stripe -->
      <rect x="-125" y="-55" width="253" height="20" fill="#cf142b" stroke="#0a0a0f" stroke-width="3"/>
      <!-- Title -->
      <g font-family="Impact, Arial Black, sans-serif" font-weight="900" fill="#fff" text-anchor="middle">
        <text x="0" y="-15" font-size="28">ENGLISH</text>
        <text x="0" y="18" font-size="28">INTERMEDIATE</text>
      </g>
      <!-- Bookmark -->
      <path d="M 90 -95 L 90 -30 L 100 -45 L 110 -30 L 110 -95 Z" fill="#ffd24a" stroke="#0a0a0f" stroke-width="3"/>
    </g>
  </g>

  <!-- A2 badge corner -->
  <g transform="translate(105 145)">
    <circle r="55" fill="#fff" stroke="#0a0a0f" stroke-width="5"/>
    <text y="-6" text-anchor="middle" font-family="system-ui, Arial" font-size="11" font-weight="800" fill="#0074d4" letter-spacing="1.5">NIVEL</text>
    <text y="24" text-anchor="middle" font-family="system-ui, Arial Black" font-size="32" font-weight="900" fill="#002244">A2</text>
  </g>
</svg>
