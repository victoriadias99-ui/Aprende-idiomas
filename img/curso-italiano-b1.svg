<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="bgB1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#008c45"/>
      <stop offset=".5" stop-color="#f4f5f0"/>
      <stop offset="1" stop-color="#cd212a"/>
    </linearGradient>
    <linearGradient id="shieldB1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd24a"/>
      <stop offset="1" stop-color="#e69a00"/>
    </linearGradient>
    <radialGradient id="glowB1" cx=".5" cy=".45" r=".55">
      <stop offset="0" stop-color="#fff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" rx="40" fill="url(#bgB1)"/>
  <circle cx="300" cy="300" r="280" fill="url(#glowB1)"/>

  <!-- decorative stars for "avanzado" -->
  <g fill="#fff" opacity=".85">
    <circle cx="80" cy="100" r="4"/>
    <circle cx="520" cy="130" r="5"/>
    <circle cx="110" cy="510" r="4"/>
    <circle cx="505" cy="490" r="3"/>
  </g>

  <!-- Venice / Italian skyline silhouette at bottom -->
  <g opacity=".65">
    <path d="M 0 470 L 60 470 L 65 430 L 95 430 L 100 410 L 130 410 L 135 440 L 170 440 L 175 400 L 210 400 L 215 420 L 245 420 L 250 380 L 290 380 L 295 420 L 330 420 L 335 390 L 370 390 L 375 410 L 410 410 L 415 450 L 450 450 L 455 420 L 485 420 L 490 440 L 520 440 L 525 460 L 600 460 L 600 550 L 0 550 Z" fill="#0a0a0f"/>
    <!-- dome Venice -->
    <circle cx="295" cy="370" r="18" fill="#0a0a0f"/>
    <rect x="287" y="340" width="16" height="32" fill="#0a0a0f"/>
    <!-- campanile -->
    <rect x="170" y="360" width="10" height="50" fill="#0a0a0f"/>
    <path d="M165 360 L185 360 L175 340 Z" fill="#0a0a0f"/>
  </g>

  <!-- Central shield / medallion with "B1" -->
  <g transform="translate(300 280)">
    <!-- decorative laurel -->
    <g stroke="#008c45" stroke-width="5" fill="#008c45" opacity=".9">
      <path d="M-110 30 Q-140 0 -130 -60" fill="none" stroke-linecap="round"/>
      <path d="M110 30 Q140 0 130 -60" fill="none" stroke-linecap="round"/>
      <ellipse cx="-125" cy="-10" rx="8" ry="14" transform="rotate(-30 -125 -10)"/>
      <ellipse cx="-135" cy="-40" rx="8" ry="14" transform="rotate(-15 -135 -40)"/>
      <ellipse cx="-115" cy="20" rx="8" ry="14" transform="rotate(-50 -115 20)"/>
      <ellipse cx="125" cy="-10" rx="8" ry="14" transform="rotate(30 125 -10)"/>
      <ellipse cx="135" cy="-40" rx="8" ry="14" transform="rotate(15 135 -40)"/>
      <ellipse cx="115" cy="20" rx="8" ry="14" transform="rotate(50 115 20)"/>
    </g>
    <!-- shield -->
    <path d="M -90 -90 L 90 -90 L 90 30 Q 90 90 0 130 Q -90 90 -90 30 Z" fill="url(#shieldB1)" stroke="#0a0a0f" stroke-width="6"/>
    <path d="M -90 -90 L 90 -90 L 90 30 Q 90 90 0 130 Q -90 90 -90 30 Z" fill="#fff" opacity=".18"/>
    <!-- Italian flag stripes top -->
    <rect x="-90" y="-90" width="60" height="20" fill="#008c45"/>
    <rect x="-30" y="-90" width="60" height="20" fill="#f4f5f0"/>
    <rect x="30" y="-90" width="60" height="20" fill="#cd212a"/>
    <!-- Level text -->
    <text x="0" y="20" text-anchor="middle" font-family="system-ui, -apple-system, Arial Black, sans-serif" font-size="72" font-weight="900" fill="#0a0a0f">B1</text>
    <text x="0" y="62" text-anchor="middle" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="14" font-weight="800" fill="#0a0a0f" letter-spacing="2">AVANZADO</text>
    <!-- 3 stars below -->
    <g fill="#0a0a0f" transform="translate(0 95)">
      <path d="M-30 0 l3 7 7 1 -5 5 1 7 -6 -3 -6 3 1 -7 -5 -5 7 -1z"/>
      <path d="M0 0 l3 7 7 1 -5 5 1 7 -6 -3 -6 3 1 -7 -5 -5 7 -1z"/>
      <path d="M30 0 l3 7 7 1 -5 5 1 7 -6 -3 -6 3 1 -7 -5 -5 7 -1z"/>
    </g>
  </g>
</svg>
