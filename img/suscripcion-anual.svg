<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none" role="img" aria-label="Suscripción Anual - 4 idiomas por USD 2 al mes">
  <defs>
    <!-- Fondo brand premium -->
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ec1389"/>
      <stop offset=".55" stop-color="#a3006b"/>
      <stop offset="1" stop-color="#00b6ed"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".5" cy=".45" r=".65">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Gold crown -->
    <linearGradient id="goldA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffeb7a"/>
      <stop offset="1" stop-color="#e09900"/>
    </linearGradient>
    <!-- Orb / medallion central -->
    <radialGradient id="orbA" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".7" stop-color="#f5f0ff"/>
      <stop offset="1" stop-color="#dcd0ea"/>
    </radialGradient>
    <!-- Flag gradients -->
    <linearGradient id="flagUS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#012169"/>
      <stop offset="1" stop-color="#0039a6"/>
    </linearGradient>
    <!-- Shadow -->
    <filter id="dropA" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="5"/>
      <feComponentTransfer><feFuncA type="linear" slope=".35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="600" height="600" rx="40" fill="url(#bgA)"/>
  <circle cx="300" cy="300" r="320" fill="url(#glowA)"/>

  <!-- Orbitas decorativas suaves -->
  <g stroke="#ffffff" stroke-width="1.2" opacity=".22" fill="none">
    <ellipse cx="300" cy="300" rx="240" ry="140" transform="rotate(-15 300 300)"/>
    <ellipse cx="300" cy="300" rx="260" ry="90" transform="rotate(25 300 300)"/>
  </g>

  <!-- Sparkles -->
  <g fill="#ffeb7a" opacity=".95">
    <path d="M 90 140 l 5 11 12 2 -9 9 2 12 -10 -6 -10 6 2 -12 -9 -9 12 -2 z"/>
    <path d="M 520 170 l 4 9 9 1 -7 7 2 10 -8 -5 -8 5 2 -10 -7 -7 9 -1 z"/>
  </g>
  <g fill="#ffffff" opacity=".8">
    <circle cx="110" cy="500" r="4"/>
    <circle cx="490" cy="500" r="3"/>
    <circle cx="540" cy="340" r="3"/>
    <circle cx="60" cy="300" r="3"/>
  </g>

  <!-- CORONA arriba -->
  <g transform="translate(300 75)" filter="url(#dropA)">
    <path d="M -48 22 L -48 -5 L -20 14 L 0 -20 L 20 14 L 48 -5 L 48 22 Z"
          fill="url(#goldA)" stroke="#0a0a0f" stroke-width="3.5" stroke-linejoin="round"/>
    <rect x="-52" y="22" width="104" height="10" rx="3" fill="url(#goldA)" stroke="#0a0a0f" stroke-width="3"/>
    <circle cx="-48" cy="-5" r="5" fill="#ec1389" stroke="#0a0a0f" stroke-width="2.5"/>
    <circle cx="48" cy="-5" r="5" fill="#00b6ed" stroke="#0a0a0f" stroke-width="2.5"/>
    <circle cx="0" cy="-20" r="4" fill="#ffffff" stroke="#0a0a0f" stroke-width="2"/>
  </g>

  <!-- BADGE "MEJOR PRECIO" arriba izquierda -->
  <g transform="translate(90 65)" filter="url(#dropA)">
    <rect x="0" y="0" width="210" height="50" rx="25" fill="#00b6ed"/>
    <text x="105" y="32" text-anchor="middle"
          font-family="'Sora', system-ui, -apple-system, sans-serif"
          font-size="18" font-weight="900" fill="#ffffff" letter-spacing="1.2">
      ✦ MEJOR PRECIO
    </text>
  </g>

  <!-- STAR BURST "AHORRÁS 50%" -->
  <g transform="translate(120 220)" filter="url(#dropA)">
    <path d="M 0 -55 L 10 -22 L 44 -30 L 24 -6 L 52 14 L 18 16 L 22 48 L 0 26 L -22 48 L -18 16 L -52 14 L -24 -6 L -44 -30 L -10 -22 Z"
          fill="#ffeb3a" stroke="#0a0a0f" stroke-width="3" stroke-linejoin="round"/>
    <text x="0" y="-2" text-anchor="middle" font-family="'Sora', system-ui, sans-serif"
          font-size="12" font-weight="900" fill="#0a0a0f" letter-spacing=".5">AHORRÁS</text>
    <text x="0" y="22" text-anchor="middle" font-family="'Sora', system-ui, sans-serif"
          font-size="22" font-weight="900" fill="#0a0a0f">50%</text>
  </g>

  <!-- MEDALLÓN CENTRAL (reemplaza el patron cuadriculado viejo) -->
  <g transform="translate(300 330)" filter="url(#dropA)">
    <!-- Anillo exterior -->
    <circle cx="0" cy="0" r="155" fill="#ffffff" stroke="#0a0a0f" stroke-width="4"/>
    <circle cx="0" cy="0" r="140" fill="url(#orbA)"/>

    <!-- Texto "ALL ACCESS" arco -->
    <path id="arcTop" d="M -115 -20 A 125 125 0 0 1 115 -20" fill="none"/>
    <text font-family="'Sora', system-ui, sans-serif" font-size="20" font-weight="900" fill="#0a0a0f" letter-spacing="4">
      <textPath href="#arcTop" startOffset="50%" text-anchor="middle">ALL-ACCESS PLAN</textPath>
    </text>

    <!-- Grid 2x2 de banderas (EN, IT, DE, JP) -->
    <!-- EN - arriba izq -->
    <g transform="translate(-42 10)">
      <circle cx="0" cy="0" r="34" fill="url(#flagUS)" stroke="#0a0a0f" stroke-width="3"/>
      <g clip-path="circle(31px at 0 0)">
        <rect x="-34" y="-5" width="68" height="10" fill="#ffffff"/>
        <rect x="-5" y="-34" width="10" height="68" fill="#ffffff"/>
        <rect x="-34" y="-3" width="68" height="6" fill="#cf142b"/>
        <rect x="-3" y="-34" width="6" height="68" fill="#cf142b"/>
      </g>
      <text x="0" y="52" text-anchor="middle" font-family="'Sora', system-ui, sans-serif" font-size="11" font-weight="900" fill="#0a0a0f">EN</text>
    </g>

    <!-- IT - arriba der -->
    <g transform="translate(42 10)">
      <circle cx="0" cy="0" r="34" stroke="#0a0a0f" stroke-width="3" fill="#ffffff"/>
      <g clip-path="circle(31px at 0 0)">
        <rect x="-32" y="-32" width="22" height="64" fill="#009246"/>
        <rect x="-10" y="-32" width="22" height="64" fill="#ffffff"/>
        <rect x="10"  y="-32" width="22" height="64" fill="#ce2b37"/>
      </g>
      <text x="0" y="52" text-anchor="middle" font-family="'Sora', system-ui, sans-serif" font-size="11" font-weight="900" fill="#0a0a0f">IT</text>
    </g>

    <!-- DE - abajo izq -->
    <g transform="translate(-42 82)">
      <circle cx="0" cy="0" r="26" stroke="#0a0a0f" stroke-width="3" fill="#ffffff"/>
      <g clip-path="circle(23px at 0 0)">
        <rect x="-26" y="-26" width="52" height="18" fill="#000000"/>
        <rect x="-26" y="-8" width="52" height="16" fill="#dd0000"/>
        <rect x="-26" y="8"  width="52" height="18" fill="#ffce00"/>
      </g>
      <text x="0" y="42" text-anchor="middle" font-family="'Sora', system-ui, sans-serif" font-size="10" font-weight="900" fill="#0a0a0f">DE</text>
    </g>

    <!-- JP - abajo der -->
    <g transform="translate(42 82)">
      <circle cx="0" cy="0" r="26" stroke="#0a0a0f" stroke-width="3" fill="#ffffff"/>
      <circle cx="0" cy="0" r="11" fill="#bc002d"/>
      <text x="0" y="42" text-anchor="middle" font-family="'Sora', system-ui, sans-serif" font-size="10" font-weight="900" fill="#0a0a0f">JP</text>
    </g>
  </g>

  <!-- BADGE redondo "ANUAL / USD 2 / mes" abajo der -->
  <g transform="translate(480 440)" filter="url(#dropA)">
    <circle cx="0" cy="0" r="72" fill="#ffffff" stroke="#0a0a0f" stroke-width="3"/>
    <text x="0" y="-20" text-anchor="middle" font-family="'Sora', system-ui, sans-serif"
          font-size="12" font-weight="900" fill="#ec1389" letter-spacing="2">ANUAL</text>
    <text x="0" y="10" text-anchor="middle" font-family="'Sora', system-ui, sans-serif"
          font-size="26" font-weight="900" fill="#0a0a0f">USD 2</text>
    <text x="0" y="32" text-anchor="middle" font-family="'Sora', system-ui, sans-serif"
          font-size="12" font-weight="700" fill="#5a5d72">/mes</text>
  </g>

  <!-- Mini tag "12 MESES" -->
  <g transform="translate(100 460)" filter="url(#dropA)">
    <rect x="0" y="0" width="108" height="36" rx="18" fill="#ffffff"/>
    <text x="54" y="24" text-anchor="middle" font-family="'Sora', system-ui, sans-serif"
          font-size="13" font-weight="900" fill="#0a0a0f" letter-spacing=".5">✓ 12 MESES</text>
  </g>
</svg>
