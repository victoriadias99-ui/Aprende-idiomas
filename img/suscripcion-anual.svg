<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="bgSa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ec1389"/>
      <stop offset=".55" stop-color="#a3006b"/>
      <stop offset="1" stop-color="#00b6ed"/>
    </linearGradient>
    <radialGradient id="globeA" cx=".3" cy=".3" r=".8">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#ffd3e9"/>
    </radialGradient>
    <linearGradient id="crownG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe26a"/>
      <stop offset="1" stop-color="#e6a100"/>
    </linearGradient>
    <radialGradient id="glowSa" cx=".5" cy=".5" r=".6">
      <stop offset="0" stop-color="#fff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" rx="40" fill="url(#bgSa)"/>
  <circle cx="300" cy="320" r="280" fill="url(#glowSa)"/>

  <!-- premium sparkles -->
  <g fill="#ffe26a" opacity=".95">
    <path d="M 90 140 l 5 11 12 2 -9 9 2 12 -10 -6 -10 6 2 -12 -9 -9 12 -2 z"/>
    <path d="M 520 170 l 4 9 9 1 -7 7 2 10 -8 -5 -8 5 2 -10 -7 -7 9 -1 z"/>
  </g>
  <g fill="#fff" opacity=".8">
    <circle cx="110" cy="500" r="4"/>
    <circle cx="500" cy="480" r="3"/>
    <circle cx="60" cy="300" r="3"/>
    <circle cx="540" cy="320" r="3"/>
  </g>

  <!-- Orbit rings -->
  <g stroke="#fff" stroke-width="2" fill="none" opacity=".4">
    <ellipse cx="300" cy="310" rx="250" ry="90" transform="rotate(-15 300 310)"/>
    <ellipse cx="300" cy="310" rx="240" ry="100" transform="rotate(18 300 310)"/>
  </g>

  <!-- Crown ABOVE globe (premium/anual) -->
  <g transform="translate(300 130)">
    <path d="M-66 0 L-40 -40 L-20 -10 L0 -50 L20 -10 L40 -40 L66 0 L56 30 L-56 30 Z" fill="url(#crownG)" stroke="#0a0a0f" stroke-width="5" stroke-linejoin="round"/>
    <rect x="-56" y="22" width="112" height="10" fill="#0a0a0f"/>
    <!-- gems on crown -->
    <circle cx="-40" cy="-30" r="5" fill="#ec1389" stroke="#0a0a0f" stroke-width="2"/>
    <circle cx="0" cy="-40" r="6" fill="#00b6ed" stroke="#0a0a0f" stroke-width="2"/>
    <circle cx="40" cy="-30" r="5" fill="#ec1389" stroke="#0a0a0f" stroke-width="2"/>
  </g>

  <!-- Globe center -->
  <g transform="translate(300 320)">
    <circle r="130" fill="url(#globeA)" stroke="#0a0a0f" stroke-width="6"/>
    <defs>
      <clipPath id="globeClipA">
        <circle r="125"/>
      </clipPath>
    </defs>
    <g clip-path="url(#globeClipA)">
      <!-- row 1 -->
      <rect x="-130" y="-105" width="52" height="35" fill="#dc2626"/>
      <rect x="-78" y="-105" width="52" height="35" fill="#1e40af"/>
      <rect x="-26" y="-105" width="52" height="35" fill="#fcd34d"/>
      <rect x="26" y="-105" width="52" height="35" fill="#16a34a"/>
      <rect x="78" y="-105" width="52" height="35" fill="#111827"/>
      <!-- row 2 -->
      <rect x="-130" y="-70" width="52" height="35" fill="#fcd34d"/>
      <rect x="-78" y="-70" width="52" height="35" fill="#fff"/>
      <rect x="-26" y="-70" width="52" height="35" fill="#ec1389"/>
      <rect x="26" y="-70" width="52" height="35" fill="#0c4a6e"/>
      <rect x="78" y="-70" width="52" height="35" fill="#16a34a"/>
      <!-- row 3 -->
      <rect x="-130" y="-35" width="52" height="35" fill="#16a34a"/>
      <rect x="-78" y="-35" width="52" height="35" fill="#1e40af"/>
      <rect x="-26" y="-35" width="52" height="35" fill="#dc2626"/>
      <rect x="26" y="-35" width="52" height="35" fill="#fcd34d"/>
      <rect x="78" y="-35" width="52" height="35" fill="#fff"/>
      <!-- row 4 -->
      <rect x="-130" y="0" width="52" height="35" fill="#111827"/>
      <rect x="-78" y="0" width="52" height="35" fill="#fcd34d"/>
      <rect x="-26" y="0" width="52" height="35" fill="#fff"/>
      <rect x="26" y="0" width="52" height="35" fill="#16a34a"/>
      <rect x="78" y="0" width="52" height="35" fill="#ec1389"/>
      <!-- row 5 -->
      <rect x="-130" y="35" width="52" height="35" fill="#dc2626"/>
      <rect x="-78" y="35" width="52" height="35" fill="#fff"/>
      <rect x="-26" y="35" width="52" height="35" fill="#0c4a6e"/>
      <rect x="26" y="35" width="52" height="35" fill="#fcd34d"/>
      <rect x="78" y="35" width="52" height="35" fill="#16a34a"/>
      <!-- row 6 -->
      <rect x="-130" y="70" width="52" height="35" fill="#fcd34d"/>
      <rect x="-78" y="70" width="52" height="35" fill="#16a34a"/>
      <rect x="-26" y="70" width="52" height="35" fill="#ec1389"/>
      <rect x="26" y="70" width="52" height="35" fill="#1e40af"/>
      <rect x="78" y="70" width="52" height="35" fill="#fff"/>
    </g>
    <circle r="130" fill="none" stroke="#0a0a0f" stroke-width="6"/>
    <path d="M -120 -35 Q 0 10 120 -35" stroke="#fff" stroke-width="3" fill="none" opacity=".55"/>
  </g>

  <!-- MEJOR PRECIO burst (left side) -->
  <g transform="translate(100 230)">
    <path d="M0 -54 L10 -22 L42 -32 L32 0 L62 10 L32 20 L42 52 L10 44 L0 76 L-10 44 L-42 52 L-32 20 L-62 10 L-32 0 L-42 -32 L-10 -22 Z" fill="#ffd24a" stroke="#0a0a0f" stroke-width="4"/>
    <text y="-8" text-anchor="middle" font-family="system-ui, Arial" font-size="10" font-weight="800" fill="#0a0a0f" letter-spacing="1">AHORRAS</text>
    <text y="18" text-anchor="middle" font-family="system-ui, Arial Black" font-size="24" font-weight="900" fill="#0a0a0f">50%</text>
  </g>

  <!-- USD 2/mes big badge bottom right -->
  <g transform="translate(470 470)">
    <circle r="72" fill="#fff" stroke="#0a0a0f" stroke-width="5"/>
    <text y="-22" text-anchor="middle" font-family="system-ui, Arial" font-size="10" font-weight="800" fill="#ec1389" letter-spacing="1.5">ANUAL</text>
    <text y="4" text-anchor="middle" font-family="system-ui, Arial Black" font-size="28" font-weight="900" fill="#0a0a0f">USD 2</text>
    <text y="24" text-anchor="middle" font-family="system-ui, Arial" font-size="11" font-weight="700" fill="#5a5d72">/mes</text>
    <text y="44" text-anchor="middle" font-family="system-ui, Arial" font-size="9" font-weight="600" fill="#5a5d72" letter-spacing=".5">USD 24/año</text>
  </g>
</svg>
