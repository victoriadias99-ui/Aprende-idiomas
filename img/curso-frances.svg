<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="bgFr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0055a4"/>
      <stop offset="1" stop-color="#002244"/>
    </linearGradient>
    <radialGradient id="glowFr" cx=".5" cy=".5" r=".6">
      <stop offset="0" stop-color="#fff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" rx="40" fill="url(#bgFr)"/>
  <circle cx="300" cy="280" r="280" fill="url(#glowFr)"/>

  <!-- French flag vertical stripes subtle -->
  <g opacity=".3">
    <rect x="0" y="0" width="200" height="600" fill="#0055a4"/>
    <rect x="200" y="0" width="200" height="600" fill="#fff"/>
    <rect x="400" y="0" width="200" height="600" fill="#ef4135"/>
  </g>

  <g fill="#fff" opacity=".85">
    <circle cx="90" cy="100" r="4"/>
    <path d="M 510 130 l 4 9 9 1 -7 7 2 10 -8 -5 -8 5 2 -10 -7 -7 9 -1 z"/>
    <circle cx="110" cy="510" r="4"/>
    <circle cx="500" cy="490" r="4"/>
  </g>

  <!-- Eiffel Tower centered -->
  <g transform="translate(300 330)">
    <!-- ground shadow -->
    <ellipse cx="0" cy="180" rx="120" ry="14" fill="#000" opacity=".3"/>
    <!-- tower silhouette -->
    <g fill="#111" stroke="#0a0a0f" stroke-width="3" stroke-linejoin="round">
      <!-- base arch -->
      <path d="M -110 180 L -110 140 L -90 120 L 90 120 L 110 140 L 110 180 Z"/>
      <path d="M -70 140 Q 0 100 70 140" fill="#0055a4"/>
      <!-- mid section -->
      <path d="M -80 120 L -70 80 L 70 80 L 80 120 Z"/>
      <!-- upper taper -->
      <path d="M -60 80 L -50 30 L 50 30 L 60 80 Z"/>
      <!-- top tower -->
      <path d="M -40 30 L -20 -90 L 20 -90 L 40 30 Z"/>
      <!-- antenna -->
      <rect x="-5" y="-130" width="10" height="40"/>
      <rect x="-2" y="-160" width="4" height="30"/>
    </g>
    <!-- cross lattice lines decorative -->
    <g stroke="#fff" stroke-width="2" opacity=".5">
      <line x1="-95" y1="130" x2="95" y2="130"/>
      <line x1="-75" y1="100" x2="75" y2="100"/>
      <line x1="-55" y1="60" x2="55" y2="60"/>
      <line x1="-35" y1="15" x2="35" y2="15"/>
    </g>
  </g>

  <!-- Speech bubble "Bonjour!" top -->
  <g transform="translate(430 130)">
    <path d="M0 0 H130 Q150 0 150 20 V50 Q150 70 130 70 H30 L10 88 L14 70 Q0 68 0 50 Z" fill="#fff" stroke="#0a0a0f" stroke-width="5"/>
    <text x="75" y="46" text-anchor="middle" font-family="system-ui, Arial Black, sans-serif" font-size="22" font-weight="900" fill="#0055a4">Bonjour!</text>
  </g>

  <!-- A1 badge -->
  <g transform="translate(130 160)">
    <circle r="55" fill="#fff" stroke="#0a0a0f" stroke-width="5"/>
    <text y="-6" text-anchor="middle" font-family="system-ui, Arial" font-size="11" font-weight="800" fill="#0055a4" letter-spacing="1.5">NIVEL</text>
    <text y="24" text-anchor="middle" font-family="system-ui, Arial Black" font-size="32" font-weight="900" fill="#ef4135">A1</text>
  </g>
</svg>
