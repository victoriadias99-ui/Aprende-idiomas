<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="bgIA2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffce3c"/>
      <stop offset="1" stop-color="#ff8a00"/>
    </linearGradient>
    <linearGradient id="gondolaG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#333"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <radialGradient id="glowIA2" cx=".5" cy=".5" r=".6">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" rx="40" fill="url(#bgIA2)"/>
  <circle cx="300" cy="260" r="280" fill="url(#glowIA2)"/>

  <!-- sun -->
  <g transform="translate(470 130)">
    <circle r="55" fill="#fff" opacity=".4"/>
    <circle r="42" fill="#fff" opacity=".7"/>
  </g>

  <!-- sparkles -->
  <g fill="#fff" opacity=".85">
    <circle cx="90" cy="110" r="4"/>
    <circle cx="110" cy="510" r="3"/>
    <circle cx="520" cy="490" r="4"/>
  </g>

  <!-- Venetian canal silhouette -->
  <g>
    <!-- Buildings reflection -->
    <path d="M 0 380 L 0 300 L 60 300 L 60 250 L 120 250 L 120 290 L 170 290 L 170 260 L 230 260 L 230 280 L 280 280 L 280 240 L 340 240 L 340 270 L 400 270 L 400 250 L 460 250 L 460 290 L 520 290 L 520 270 L 600 270 L 600 380 Z" fill="#d45500" opacity=".7"/>
    <!-- Church dome -->
    <circle cx="280" cy="225" r="20" fill="#e86c00"/>
    <rect x="270" y="210" width="20" height="30" fill="#e86c00"/>
    <!-- campanile -->
    <rect x="390" y="210" width="10" height="55" fill="#e86c00"/>
    <path d="M385 210 L405 210 L395 185 Z" fill="#e86c00"/>
  </g>

  <!-- Water -->
  <rect x="0" y="380" width="600" height="220" fill="#0074d4" opacity=".75"/>
  <!-- Water ripples -->
  <g stroke="#fff" stroke-width="2" fill="none" opacity=".5">
    <path d="M 20 430 Q 60 435 100 430 Q 140 425 180 430"/>
    <path d="M 220 460 Q 260 465 300 460 Q 340 455 380 460"/>
    <path d="M 420 440 Q 460 445 500 440 Q 540 435 580 440"/>
    <path d="M 40 500 Q 100 505 160 500"/>
    <path d="M 380 520 Q 440 525 500 520"/>
  </g>

  <!-- Gondola -->
  <g transform="translate(300 420)">
    <!-- hull -->
    <path d="M -130 0 Q -110 22 0 26 Q 110 22 130 0 Q 120 -8 0 -6 Q -120 -8 -130 0 Z" fill="url(#gondolaG)" stroke="#0a0a0f" stroke-width="3"/>
    <!-- front curved -->
    <path d="M 130 0 Q 145 -10 150 -30 L 140 -28 Q 135 -10 128 -4 Z" fill="#0a0a0f"/>
    <!-- seat -->
    <rect x="-40" y="-20" width="50" height="18" fill="#cd212a" stroke="#0a0a0f" stroke-width="2"/>
    <!-- gondolier (stylized, standing) -->
    <g transform="translate(-80 -20)">
      <circle cx="0" cy="-50" r="10" fill="#fdddc0" stroke="#0a0a0f" stroke-width="2"/>
      <!-- striped shirt -->
      <rect x="-12" y="-40" width="24" height="30" fill="#fff" stroke="#0a0a0f" stroke-width="2"/>
      <line x1="-12" y1="-36" x2="12" y2="-36" stroke="#cd212a" stroke-width="2"/>
      <line x1="-12" y1="-30" x2="12" y2="-30" stroke="#cd212a" stroke-width="2"/>
      <line x1="-12" y1="-24" x2="12" y2="-24" stroke="#cd212a" stroke-width="2"/>
      <line x1="-12" y1="-18" x2="12" y2="-18" stroke="#cd212a" stroke-width="2"/>
      <!-- hat -->
      <ellipse cx="0" cy="-60" rx="16" ry="4" fill="#0a0a0f"/>
      <rect x="-8" y="-68" width="16" height="10" fill="#0a0a0f"/>
      <rect x="-10" y="-58" width="20" height="3" fill="#cd212a"/>
      <!-- oar -->
      <line x1="15" y1="-30" x2="80" y2="20" stroke="#8c5e20" stroke-width="5" stroke-linecap="round"/>
      <path d="M 80 20 L 100 10 L 105 28 L 85 36 Z" fill="#8c5e20" stroke="#0a0a0f" stroke-width="2"/>
    </g>
  </g>

  <!-- A2 badge -->
  <g transform="translate(120 150)">
    <circle r="55" fill="#fff" stroke="#0a0a0f" stroke-width="5"/>
    <text y="-6" text-anchor="middle" font-family="system-ui, Arial" font-size="11" font-weight="800" fill="#ff8a00" letter-spacing="1.5">NIVEL</text>
    <text y="24" text-anchor="middle" font-family="system-ui, Arial Black" font-size="32" font-weight="900" fill="#d45500">A2</text>
  </g>
</svg>
