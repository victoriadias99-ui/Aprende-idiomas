<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none" role="img" aria-label="Inglés Nivel 2 - Sumá inglés a tu CV">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e3f6fd"/>
    </linearGradient>
    <linearGradient id="brandC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ec1389"/>
      <stop offset="1" stop-color="#00b6ed"/>
    </linearGradient>
    <linearGradient id="cvCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f9fc"/>
    </linearGradient>
    <linearGradient id="suitC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2030"/>
      <stop offset="1" stop-color="#0a0a0f"/>
    </linearGradient>
    <radialGradient id="glowC" cx=".5" cy=".5" r=".6">
      <stop offset="0" stop-color="#ec1389" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ec1389" stop-opacity="0"/>
    </radialGradient>
    <filter id="shC" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope=".2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="600" rx="40" fill="url(#bgC)"/>
  <circle cx="300" cy="320" r="280" fill="url(#glowC)"/>

  <!-- Shapes decorativas -->
  <g opacity=".15">
    <circle cx="90" cy="100" r="55" fill="#00b6ed"/>
    <circle cx="530" cy="500" r="70" fill="#ec1389"/>
    <circle cx="510" cy="80" r="14" fill="#ec1389"/>
  </g>

  <!-- Badge superior: EMPEZA HOY -->
  <g filter="url(#shC)">
    <rect x="195" y="60" width="210" height="46" rx="23" fill="url(#brandC)"/>
    <text x="300" y="89" text-anchor="middle" font-family="system-ui, sans-serif"
          font-size="16" font-weight="900" fill="#ffffff" letter-spacing="1.3">
      ✦ EMPEZA HOY
    </text>
  </g>

  <!-- CV CARD central -->
  <g transform="translate(300 320)" filter="url(#shC)">
    <!-- Carta/CV -->
    <rect x="-130" y="-150" width="260" height="300" rx="14" fill="url(#cvCard)"/>

    <!-- Header del CV con avatar circular -->
    <rect x="-130" y="-150" width="260" height="62" rx="14" fill="#1d4ed8"/>
    <rect x="-130" y="-110" width="260" height="22" fill="#1d4ed8"/>

    <!-- Avatar -->
    <circle cx="-85" cy="-118" r="22" fill="#ffffff"/>
    <circle cx="-85" cy="-124" r="8" fill="#1d4ed8"/>
    <path d="M -100 -100 Q -85 -114 -70 -100" fill="#1d4ed8"/>

    <!-- Nombre del CV (mock) -->
    <rect x="-50" y="-128" width="120" height="8" rx="3" fill="#ffffff" opacity=".95"/>
    <rect x="-50" y="-115" width="80" height="6" rx="3" fill="#ffffff" opacity=".7"/>

    <!-- Seccion: Languages -->
    <text x="-110" y="-60" font-family="'Sora', system-ui, sans-serif"
          font-size="14" font-weight="900" fill="#0a0a0f">LANGUAGES</text>
    <rect x="-110" y="-52" width="50" height="3" fill="url(#brandC)"/>

    <!-- Language row 1: English -->
    <g transform="translate(-110 -30)">
      <!-- UK flag mini -->
      <circle cx="10" cy="10" r="9" fill="#012169"/>
      <g clip-path="inset(0 round 9px)">
        <rect x="1" y="7" width="18" height="6" fill="#ffffff"/>
        <rect x="7" y="1" width="6" height="18" fill="#ffffff"/>
        <rect x="1" y="8.5" width="18" height="3" fill="#cf142b"/>
        <rect x="8.5" y="1" width="3" height="18" fill="#cf142b"/>
      </g>
      <text x="26" y="14" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0a0a0f">English</text>
      <text x="26" y="28" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#15803d">Intermediate B1 ✓</text>
      <!-- Progress bar -->
      <rect x="140" y="4" width="70" height="8" rx="4" fill="#e5e7eb"/>
      <rect x="140" y="4" width="52" height="8" rx="4" fill="url(#brandC)"/>
      <text x="175" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#5a5d72">75%</text>
    </g>

    <!-- Separador -->
    <line x1="-110" y1="20" x2="110" y2="20" stroke="#e5e7eb" stroke-width="1"/>

    <!-- Seccion: Skills -->
    <text x="-110" y="50" font-family="'Sora', system-ui, sans-serif"
          font-size="14" font-weight="900" fill="#0a0a0f">SKILLS</text>
    <rect x="-110" y="58" width="50" height="3" fill="url(#brandC)"/>

    <!-- Skill chips -->
    <g transform="translate(-110 75)">
      <rect x="0" y="0" width="88" height="26" rx="13" fill="#dbeafe"/>
      <text x="44" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#1d4ed8">Speaking</text>

      <rect x="96" y="0" width="78" height="26" rx="13" fill="#fce7f3"/>
      <text x="135" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ec1389">Writing</text>

      <rect x="0" y="34" width="108" height="26" rx="13" fill="#d1fae5"/>
      <text x="54" y="51" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#059669">Business Talk</text>

      <rect x="116" y="34" width="58" height="26" rx="13" fill="#fef3c7"/>
      <text x="145" y="51" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#b45309">Email</text>
    </g>
  </g>

  <!-- Sello "+B1" arriba derecha -->
  <g transform="translate(485 200)" filter="url(#shC)">
    <circle cx="0" cy="0" r="48" fill="#ffffff" stroke="#0a0a0f" stroke-width="3"/>
    <text x="0" y="-8" text-anchor="middle" font-family="'Sora', system-ui, sans-serif"
          font-size="11" font-weight="900" fill="#ec1389" letter-spacing="1">CERTIFICADO</text>
    <text x="0" y="14" text-anchor="middle" font-family="'Sora', system-ui, sans-serif"
          font-size="22" font-weight="900" fill="#0a0a0f">B1</text>
    <text x="0" y="28" text-anchor="middle" font-family="system-ui, sans-serif"
          font-size="9" font-weight="700" fill="#5a5d72">oficial</text>
  </g>

  <!-- Bubble "Hello!" izquierda -->
  <g transform="translate(55 240)" filter="url(#shC)">
    <rect x="0" y="0" width="100" height="42" rx="21" fill="#ffffff"/>
    <path d="M20 42 L14 52 L28 42 Z" fill="#ffffff"/>
    <text x="50" y="26" text-anchor="middle" font-family="'Sora', system-ui, sans-serif"
          font-size="15" font-weight="900" fill="url(#brandC)">Hello!</text>
  </g>

  <!-- Bubble "Let's go!" -->
  <g transform="translate(55 430)" filter="url(#shC)">
    <rect x="0" y="0" width="110" height="42" rx="21" fill="#ffffff"/>
    <text x="55" y="26" text-anchor="middle" font-family="'Sora', system-ui, sans-serif"
          font-size="14" font-weight="900" fill="#0a0a0f">Let's go!</text>
  </g>

  <!-- Tagline inferior -->
  <text x="300" y="545" text-anchor="middle" font-family="'Sora', system-ui, sans-serif"
        font-size="22" font-weight="900" fill="#0a0a0f" letter-spacing="-0.3">
    Sumá inglés a tu CV
  </text>
  <text x="300" y="572" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="13" font-weight="600" fill="#5a5d72">
    Nivel intermedio · Certificado · 30 días de acceso
  </text>
</svg>
