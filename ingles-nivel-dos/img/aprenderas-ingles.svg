<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none" role="img" aria-label="Aprenderás inglés intermedio - Plan de estudio">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e3f6fd"/>
    </linearGradient>
    <linearGradient id="brandL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ec1389"/>
      <stop offset="1" stop-color="#00b6ed"/>
    </linearGradient>
    <linearGradient id="bookL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f5fb"/>
    </linearGradient>
    <radialGradient id="glowL" cx=".5" cy=".5" r=".6">
      <stop offset="0" stop-color="#00b6ed" stop-opacity=".2"/>
      <stop offset="1" stop-color="#00b6ed" stop-opacity="0"/>
    </radialGradient>
    <filter id="shL" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="5"/>
      <feComponentTransfer><feFuncA type="linear" slope=".2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="600" rx="40" fill="url(#bgL)"/>
  <circle cx="300" cy="300" r="280" fill="url(#glowL)"/>

  <!-- Shapes decorativas -->
  <g opacity=".15">
    <circle cx="80" cy="90" r="50" fill="#ec1389"/>
    <circle cx="540" cy="510" r="70" fill="#00b6ed"/>
  </g>

  <!-- Badge superior -->
  <g filter="url(#shL)">
    <rect x="160" y="55" width="280" height="46" rx="23" fill="url(#brandL)"/>
    <text x="300" y="84" text-anchor="middle" font-family="system-ui, sans-serif"
          font-size="16" font-weight="900" fill="#ffffff" letter-spacing="1.3">
      INGLES N2 · INTERMEDIO B1
    </text>
  </g>

  <!-- LIBRO ABIERTO centro -->
  <g transform="translate(300 300)" filter="url(#shL)">
    <!-- Sombra del libro -->
    <ellipse cx="0" cy="110" rx="180" ry="12" fill="#0a0a0f" opacity=".12"/>

    <!-- Cubiertas -->
    <path d="M -165 -95 L -10 -110 L -10 95 L -165 110 Z" fill="url(#bookL)"/>
    <path d="M 165 -95 L 10 -110 L 10 95 L 165 110 Z" fill="url(#bookL)"/>

    <!-- Paginas -->
    <path d="M -160 -88 L -15 -103 L -15 88 L -160 103 Z" fill="url(#pageL)"/>
    <path d="M 160 -88 L 15 -103 L 15 88 L 160 103 Z" fill="url(#pageL)"/>

    <!-- Lomo central -->
    <rect x="-12" y="-105" width="24" height="210" fill="#0f1e4a"/>

    <!-- Lineas de texto pagina izquierda -->
    <g stroke="#9ca3af" stroke-width="3" stroke-linecap="round" opacity=".7">
      <line x1="-145" y1="-60" x2="-30" y2="-70"/>
      <line x1="-145" y1="-40" x2="-55" y2="-50"/>
      <line x1="-145" y1="-20" x2="-40" y2="-30"/>
    </g>

    <!-- Topic highlight pagina izquierda: Tenses -->
    <rect x="-145" y="5" width="130" height="28" rx="5" fill="#dbeafe"/>
    <text x="-80" y="24" text-anchor="middle" font-family="system-ui, sans-serif"
          font-size="13" font-weight="800" fill="#1d4ed8">Past Perfect</text>

    <!-- Lineas pagina derecha -->
    <g stroke="#9ca3af" stroke-width="3" stroke-linecap="round" opacity=".7">
      <line x1="30" y1="-70" x2="145" y2="-60"/>
      <line x1="55" y1="-50" x2="145" y2="-40"/>
      <line x1="40" y1="-30" x2="145" y2="-20"/>
    </g>

    <!-- Topic highlight pagina derecha: Conditionals -->
    <rect x="15" y="5" width="130" height="28" rx="5" fill="#fce7f3"/>
    <text x="80" y="24" text-anchor="middle" font-family="system-ui, sans-serif"
          font-size="13" font-weight="800" fill="#ec1389">Conditionals</text>

    <!-- Bookmark -->
    <path d="M 80 -103 L 95 -110 L 110 -103 L 110 -50 L 95 -58 L 80 -50 Z" fill="#ec1389"/>
  </g>

  <!-- Bubbles de temas flotando -->
  <g filter="url(#shL)">
    <g transform="translate(60 180)">
      <rect x="0" y="0" width="130" height="42" rx="21" fill="#ffffff"/>
      <text x="65" y="27" text-anchor="middle" font-family="system-ui, sans-serif"
            font-size="14" font-weight="800" fill="#1d4ed8">Past Simple</text>
    </g>
    <g transform="translate(420 165)">
      <rect x="0" y="0" width="140" height="42" rx="21" fill="#ffffff"/>
      <text x="70" y="27" text-anchor="middle" font-family="system-ui, sans-serif"
            font-size="14" font-weight="800" fill="#ec1389">Future Tenses</text>
    </g>
    <g transform="translate(55 435)">
      <rect x="0" y="0" width="140" height="42" rx="21" fill="#ffffff"/>
      <text x="70" y="27" text-anchor="middle" font-family="system-ui, sans-serif"
            font-size="14" font-weight="800" fill="#0a0a0f">Phrasal Verbs</text>
    </g>
    <g transform="translate(420 440)">
      <rect x="0" y="0" width="140" height="42" rx="21" fill="#ffffff"/>
      <text x="70" y="27" text-anchor="middle" font-family="system-ui, sans-serif"
            font-size="14" font-weight="800" fill="#1d4ed8">Reported speech</text>
    </g>
  </g>

  <!-- Estrella decorativa -->
  <g transform="translate(510 120)" opacity=".9">
    <path d="M0 -16 L4 -4 L16 0 L4 4 L0 16 L-4 4 L-16 0 L-4 -4 Z" fill="url(#brandL)"/>
  </g>

  <!-- Tagline inferior -->
  <text x="300" y="548" text-anchor="middle" font-family="'Sora', system-ui, sans-serif"
        font-size="22" font-weight="900" fill="#0a0a0f" letter-spacing="-0.3">
    6 temas clave · nivel intermedio
  </text>
</svg>
