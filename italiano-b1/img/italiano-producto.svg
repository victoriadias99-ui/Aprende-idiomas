<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none" role="img" aria-label="Italiano B1 - Ciudadanía italiana">
  <defs>
    <linearGradient id="bgB1p" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="brandB1p" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ec1389"/><stop offset="1" stop-color="#00b6ed"/>
    </linearGradient>
    <linearGradient id="redB1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ce2b37"/><stop offset="1" stop-color="#8b1a22"/>
    </linearGradient>
    <linearGradient id="goldB1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd24d"/><stop offset="1" stop-color="#d4a017"/>
    </linearGradient>
    <radialGradient id="gB1p" cx=".5" cy=".45" r=".65">
      <stop offset="0" stop-color="#ffd24d" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffd24d" stop-opacity="0"/>
    </radialGradient>
    <filter id="sB1p" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="5"/>
      <feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="600" rx="40" fill="url(#bgB1p)"/>
  <circle cx="300" cy="320" r="300" fill="url(#gB1p)"/>

  <g opacity=".15">
    <circle cx="90" cy="100" r="55" fill="#009246"/>
    <circle cx="530" cy="500" r="70" fill="#ce2b37"/>
  </g>

  <g filter="url(#sB1p)">
    <rect x="180" y="60" width="240" height="46" rx="23" fill="url(#brandB1p)"/>
    <text x="300" y="89" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="900" fill="#fff" letter-spacing="1.3">✦ CIUDADANIA ITALIANA</text>
  </g>

  <!-- Documento/certificado "Cittadinanza" -->
  <g transform="translate(300 320)" filter="url(#sB1p)">
    <rect x="-150" y="-150" width="300" height="300" rx="14" fill="#fffdf5"/>
    <!-- Header tricolor -->
    <g transform="translate(-150 -150)">
      <rect x="0" y="0" width="100" height="14" fill="#009246"/>
      <rect x="100" y="0" width="100" height="14" fill="#ffffff"/>
      <rect x="200" y="0" width="100" height="14" fill="#ce2b37"/>
    </g>
    <!-- Titulo -->
    <text x="0" y="-115" text-anchor="middle" font-family="'Sora', system-ui, sans-serif" font-size="16" font-weight="900" fill="#0a0a0f" letter-spacing="1.5">REPUBBLICA ITALIANA</text>
    <text x="0" y="-92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#5a5d72">Ministero dell'Interno</text>
    <line x1="-120" y1="-80" x2="120" y2="-80" stroke="#d1d5db" stroke-width="1"/>

    <!-- Escudo central -->
    <g transform="translate(0 -30)">
      <circle r="42" fill="url(#goldB1)"/>
      <circle r="36" fill="none" stroke="#009246" stroke-width="3"/>
      <path d="M 0 -24 L 6.5 -7.5 L 24 -7.5 L 10 3 L 16 20 L 0 10 L -16 20 L -10 3 L -24 -7.5 L -6.5 -7.5 Z" fill="#009246"/>
    </g>

    <text x="0" y="32" text-anchor="middle" font-family="'Sora', system-ui, sans-serif" font-size="22" font-weight="900" fill="#0a0a0f" letter-spacing=".5">CITTADINANZA</text>
    <text x="0" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#5a5d72">Requisito de idioma · Nivel B1</text>

    <!-- Linea separadora -->
    <line x1="-120" y1="72" x2="120" y2="72" stroke="#d1d5db" stroke-width="1"/>

    <!-- Badge de cumplimiento -->
    <g transform="translate(0 100)">
      <rect x="-95" y="-14" width="190" height="32" rx="16" fill="#d1fae5"/>
      <text x="0" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#047857">✓ Apto para solicitud</text>
    </g>
  </g>

  <!-- Sello rojo -->
  <g transform="translate(490 195)" filter="url(#sB1p)">
    <circle cx="0" cy="0" r="52" fill="#fff" stroke="url(#redB1)" stroke-width="4" stroke-dasharray="3 2"/>
    <text x="0" y="-10" text-anchor="middle" font-family="'Sora', system-ui, sans-serif" font-size="10" font-weight="900" fill="#ce2b37" letter-spacing="1.5">CERTIFICATO</text>
    <text x="0" y="14" text-anchor="middle" font-family="'Sora', system-ui, sans-serif" font-size="22" font-weight="900" fill="#0a0a0f">B1</text>
    <text x="0" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#5a5d72">oficial</text>
  </g>

  <g filter="url(#sB1p)">
    <g transform="translate(55 250)"><rect x="0" y="0" width="110" height="42" rx="21" fill="#fff"/><path d="M20 42 L14 52 L28 42 Z" fill="#fff"/><text x="55" y="26" text-anchor="middle" font-family="'Sora', system-ui, sans-serif" font-size="15" font-weight="900" fill="url(#brandB1p)">Perfetto!</text></g>
    <g transform="translate(55 440)"><rect x="0" y="0" width="110" height="42" rx="21" fill="#fff"/><text x="55" y="26" text-anchor="middle" font-family="'Sora', system-ui, sans-serif" font-size="14" font-weight="900" fill="#0a0a0f">Famiglia</text></g>
  </g>

  <text x="300" y="545" text-anchor="middle" font-family="'Sora', system-ui, sans-serif" font-size="22" font-weight="900" fill="#0a0a0f" letter-spacing="-0.3">Preparate para la ciudadanía</text>
  <text x="300" y="572" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#5a5d72">B1 avanzado · Apto CILS · 30 días de acceso</text>
</svg>
